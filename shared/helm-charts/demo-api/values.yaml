replicaCount: 2

image:
  repository: devops-lab/demo-api
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

environment: helm

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: false
  interval: 15s
