services:
  demo-api:
    build:
      context: ../..
      dockerfile: apps/demo-api/Dockerfile
    image: devops-lab/demo-api:local
    environment:
      APP_ENV: compose
      APP_VERSION: local
      LATENCY_MS: ${LATENCY_MS:-0}
      ERROR_RATE: ${ERROR_RATE:-0}
    ports:
      - "8090:8090"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped
