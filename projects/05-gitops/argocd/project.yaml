apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo-lab
  namespace: argocd
spec:
  description: Restricted project for the demo application
  sourceRepos:
    - REPLACE_WITH_YOUR_REPOSITORY_URL
  destinations:
    - namespace: demo
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
