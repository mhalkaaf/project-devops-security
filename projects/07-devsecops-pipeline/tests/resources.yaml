apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: demo
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: example.invalid/demo-api:1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: insecure-pod
  namespace: demo
spec:
  containers:
    - name: app
      image: example.invalid/demo-api:latest
