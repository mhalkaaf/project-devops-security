receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: demo-api
          scrape_interval: 5s
          static_configs:
            - targets: [demo-api:8080]

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 128

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
